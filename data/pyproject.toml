[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "valeur-verte-data"
version = "0.1.0"
description = "Pipeline d'ingestion DVF/DPE/BAN et calcul des coefficients de valeur verte"
license = {text = "PolyForm-Noncommercial-1.0.0"}
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.1",
  "httpx>=0.27",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.3",
  "mutmut>=3.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"valeur_verte_data.db" = ["migrations/*.sql"]
"valeur_verte_data.referentiels" = ["*.txt"]

# ---- Lint / format (make data-lint) ----
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

# ---- Analyse statique (make data-stan) ----
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

# ---- Tests (make data-test) ----
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  # Certains de ces tests vident des tables : ils exigent en plus
  # VALEUR_VERTE_BASE_JETABLE=1, à ne définir que sur une base jetable (#112).
  "integration: nécessite une base PostgreSQL/PostGIS réelle (DATABASE_URL).",
]

# ---- Mutation testing (make data-mutation) ----
[tool.mutmut]
source_paths = ["src"]
# `tools/` doit être copié dans mutants/ pour que test_scope_mutation.py y importe
# le helper de scope (#151) — mutmut ne copie que source_paths + tests par défaut.
also_copy = ["tools"]
# Couche entrée/orchestration (argparse, psycopg, logging, débordement DVF) :
# ses mutants survivants sont des littéraux de help/prog et surtout des appels de
# logging (arguments et format) — de l'observabilité, pas du comportement, tuable
# seulement en assertant des messages de log (fragile, contre §1 TDD). mutmut 3.7
# ne sait pas exclure le logging (do_not_mutate_patterns est du code mort). La
# *décision* métier (INV-4 publiable/rejetée) est mutation-testée dans
# invariants.py ; cette couche est couverte par tests fonctionnels + intégration.
#
# coefficient_repository : couche repository, logique **en SQL**. Ses mutants ne
# se tuent que contre un vrai PostGIS (job `data-integration`), pas dans le job
# `data-quality` qui joue la mutation sans base — sinon ils survivent tous et le
# MSI d'une PR ne touchant que ce fichier s'effondre. Son comportement (upsert,
# relecture de l'alerte, idempotence) est couvert par `test_coefficient_db.py`.
do_not_mutate = [
    "src/valeur_verte_data/cli.py",
    "src/valeur_verte_data/orchestration.py",
    "src/valeur_verte_data/db/coefficient_repository.py",
]
