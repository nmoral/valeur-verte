# Taxonomie de labels — projet Valeur verte
# Synchronisable via .github/workflows/labels.yml (crazy-max/ghaction-github-labeler)
# Convention : "<famille>: <valeur>" pour rester filtrable et regroupable.

# ── Type ────────────────────────────────────────────────
- name: "type: epic"
  color: "6E5494"
  description: "Grand chantier regroupant des sous-issues"
- name: "type: tâche"
  color: "1D76DB"
  description: "Tâche de développement actionnable"
- name: "type: décision"
  color: "D4C5F9"
  description: "Question à trancher, se ferme par une décision documentée"
- name: "type: chore"
  color: "C2E0C6"
  description: "Mise en place, configuration, outillage"

# ── Statut (workflow kanban) ────────────────────────────
- name: "statut: à faire"
  color: "C5DEF5"
  description: "Pas encore commencé"
- name: "statut: en cours"
  color: "FBCA04"
  description: "En cours de réalisation"
- name: "statut: bloqué"
  color: "B60205"
  description: "Bloqué par une dépendance ou une décision"
- name: "statut: en revue"
  color: "5319E7"
  description: "En relecture / validation"
- name: "statut: fini"
  color: "0E8A16"
  description: "Terminé (l'issue est également fermée)"

# ── Domaine (regroupement fonctionnel) ──────────────────
- name: "domaine: données"
  color: "0052CC"
  description: "Ingestion DVF/DPE/BAN, couverture géographique"
- name: "domaine: moteur"
  color: "006B75"
  description: "Rayon adaptatif, régression, validation, coefficients"
- name: "domaine: calcul-éco"
  color: "0E8A16"
  description: "Chaîne de calcul économique, barèmes, seuils"
- name: "domaine: mode-audit"
  color: "D93F0B"
  description: "Parcours pro en rendez-vous (usage prioritaire)"
- name: "domaine: back-office"
  color: "E99695"
  description: "Espace pro : coûts, bouquets, branding, leads"
- name: "domaine: widget"
  color: "5319E7"
  description: "Widget public embarqué en iframe"
- name: "domaine: admin-interne"
  color: "B60205"
  description: "Supervision, monitoring, comptes, audit"
- name: "domaine: pdf"
  color: "FBCA04"
  description: "Génération et archivage des rapports PDF"
- name: "domaine: infra"
  color: "0366D6"
  description: "Architecture, schémas, multi-tenant, sauvegardes"
- name: "domaine: rgpd"
  color: "BFD4F2"
  description: "Protection des données personnelles"
- name: "domaine: juridique"
  color: "C5DEF5"
  description: "Cadre légal, CGU, facturation, licences"
- name: "domaine: produit"
  color: "FEF2C0"
  description: "Tarification, essai, parrainage, commercial"

# ── Jalon (à la place des milestones) ───────────────────
- name: "jalon: J1 — Données"
  color: "C2E0C6"
  description: "Ingestion Occitanie, jointure DVF/DPE, nettoyage"
- name: "jalon: J2 — Moteur"
  color: "BFDADC"
  description: "Rayon adaptatif, régression pondérée, IC"
- name: "jalon: J3 — Mode audit"
  color: "F9D0C4"
  description: "Saisie pro, bouquets, ajustement, PDF"
- name: "jalon: J4 — Admin pro"
  color: "D4C5F9"
  description: "Paramétrage coûts, bouquets, branding"
- name: "jalon: J5 — Pilote"
  color: "FEF2C0"
  description: "2 pros en gratuit, ≥ 10 rapports / 2 mois"
- name: "jalon: J6 — Widget public"
  color: "BFD4F2"
  description: "Iframe, autocomplétion BAN, capture lead, anti-abus"
- name: "jalon: transverse"
  color: "E4E669"
  description: "Chantier couvrant plusieurs jalons"
- name: "jalon: v2"
  color: "D876E3"
  description: "Extension post-MVP"

# ── Priorité ────────────────────────────────────────────
- name: "priorité: haute"
  color: "B60205"
  description: "À traiter en priorité"
- name: "priorité: moyenne"
  color: "FBCA04"
  description: "Priorité normale"
- name: "priorité: basse"
  color: "0E8A16"
  description: "Peut attendre"
