name: CI data (Python)

# Ne se déclenche QUE si du code Python (data/**) change.
on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - ".github/workflows/data-ci.yml"
  pull_request:
    paths:
      - "data/**"
      - ".github/workflows/data-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: data

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -e '.[dev]'

      - name: Lint & format (Ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Analyse statique (mypy)
        run: mypy src

      - name: Tests (pytest)
        run: pytest

      - name: Mutation testing (mutmut, MSI >= 80 %)
        run: ./tools/run-mutation.sh 80

  # Migrations + écriture en base jouées contre un vrai PostGIS (container).
  integration:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: valeur_verte
          POSTGRES_PASSWORD: valeur_verte
          POSTGRES_DB: valeur_verte
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U valeur_verte -d valeur_verte"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://valeur_verte:valeur_verte@localhost:5432/valeur_verte
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -e '.[dev]'

      - name: Migrations + tests d'intégration (PostGIS réel)
        run: pytest -m integration
