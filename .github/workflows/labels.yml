name: Sync labels

# Applique la taxonomie de .github/labels.yml (nom, couleur, description) au dépôt.
# - Lancement manuel via l'onglet Actions (workflow_dispatch)
# - Automatique quand .github/labels.yml change sur la branche par défaut
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/labels.yml"

permissions:
  issues: write

jobs:
  labeler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchroniser les labels
        uses: crazy-max/ghaction-github-labeler@v5
        with:
          yaml_file: .github/labels.yml
          # On ne supprime pas les labels absents du fichier (sécurité).
          skip_delete: true
          dry_run: false
