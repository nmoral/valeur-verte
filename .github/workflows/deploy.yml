name: Déploiement

# Déploiement du pipeline « data » sur le VPS OVH (#78).
#
# Le runner GitHub publie l'image sur GHCR puis ouvre la connexion SSH vers le
# VPS ; les identifiants vivent dans l'environnement « vps », jamais dans le dépôt.
# Déclenchement **manuel uniquement** (workflow_dispatch) : la mise en production
# est une décision explicite, jamais un effet de bord d'un merge sur main. On
# déploie le code de la branche choisie dans l'onglet Actions (par défaut main).
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Deux déploiements simultanés se disputeraient les migrations sur la même base.
concurrency:
  group: deploiement-vps
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/valeur-verte-data
  APP_IMAGE: ghcr.io/${{ github.repository_owner }}/valeur-verte-app
  REPERTOIRE_VPS: /opt/valeur-verte

jobs:
  # Le tag porte le SHA du commit : on sait toujours quel code tourne sur le VPS,
  # et un retour arrière consiste à redéployer un tag précédent.
  image:
    name: Publier l'image data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Authentification GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier
        uses: docker/build-push-action@v6
        with:
          context: data
          file: data/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  image-app:
    name: Publier l'image app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Authentification GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier
        uses: docker/build-push-action@v6
        with:
          context: app
          file: app/Dockerfile
          push: true
          tags: ${{ env.APP_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Déployer sur le VPS
    needs: [image, image-app]
    runs-on: ubuntu-latest
    environment: vps
    steps:
      - uses: actions/checkout@v4

      - name: Préparer la connexion SSH
        env:
          CLE_PRIVEE: ${{ secrets.SSH_KEY }}
          HOTE: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CLE_PRIVEE" > ~/.ssh/deploiement
          chmod 600 ~/.ssh/deploiement
          # TOFU : à durcir avec un secret SSH_KNOWN_HOSTS épinglant l'empreinte.
          ssh-keyscan -H "$HOTE" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Composer la configuration de déploiement
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_USER: valeur_verte
          POSTGRES_DB: valeur_verte
          DATA_IMAGE_TAG: ${{ github.sha }}
          APP_IMAGE_TAG: ${{ github.sha }}
          # Configuration applicative (#105) : secret Symfony, mot de passe du rôle
          # « app » (assemblé en DSN dans le compose) et clé Brevo.
          APP_SECRET: ${{ secrets.APP_SECRET }}
          APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          # L'échappement du .env est délicat (Compose y interpole « $ ») :
          # il est isolé dans un script couvert par des tests d'intégration.
          bash infra/ecrire-env.sh > deploiement.env

      - name: Téléverser le compose et la configuration
        env:
          UTILISATEUR: ${{ secrets.SSH_USER }}
          HOTE: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          # /opt appartient à root : le répertoire est provisionné une fois à la
          # main (voir infra/README.md). Sans ce contrôle, la panne se manifeste
          # par un « Permission denied » de scp, difficile à relier à sa cause.
          ssh -i ~/.ssh/deploiement "$UTILISATEUR@$HOTE" "test -w '$REPERTOIRE_VPS'" \
            || { echo "::error::$REPERTOIRE_VPS est absent ou non inscriptible sur le VPS ; voir la préparation du VPS dans infra/README.md."; exit 1; }
          scp -i ~/.ssh/deploiement infra/docker-compose.prod.yml \
            "$UTILISATEUR@$HOTE:$REPERTOIRE_VPS/docker-compose.yml"
          scp -i ~/.ssh/deploiement deploiement.env \
            "$UTILISATEUR@$HOTE:$REPERTOIRE_VPS/.env"
          # Provisionnement idempotent du rôle applicatif « app », rejoué à chaque
          # déploiement (crée le rôle, resynchronise son mot de passe, pose les droits).
          scp -i ~/.ssh/deploiement infra/provisionner-app.sql \
            "$UTILISATEUR@$HOTE:$REPERTOIRE_VPS/provisionner-app.sql"
          # Configuration du reverse proxy (Caddyfile + robots.txt), montée par le
          # service « caddy ». Sans elle, le proxy démarrerait sans sa config.
          scp -i ~/.ssh/deploiement -r infra/caddy \
            "$UTILISATEUR@$HOTE:$REPERTOIRE_VPS/caddy"
          # Tâches planifiées (#190) montées par le service « cron ». Sans elles,
          # Compose crée un répertoire à la place du crontab et l'ordonnanceur
          # démarre sans tâche — panne silencieuse, aucune purge ne tourne.
          scp -i ~/.ssh/deploiement -r infra/cron \
            "$UTILISATEUR@$HOTE:$REPERTOIRE_VPS/cron"

      - name: Tirer l'image, provisionner l'app et appliquer les migrations
        env:
          UTILISATEUR: ${{ secrets.SSH_USER }}
          HOTE: ${{ secrets.SSH_HOST }}
          JETON_GHCR: ${{ secrets.GITHUB_TOKEN }}
          COMPTE_GHCR: ${{ github.actor }}
        run: |
          set -euo pipefail
          # Le dépôt est privé : le VPS s'authentifie avec le jeton éphémère du
          # job (expire à sa fin) plutôt qu'avec un PAT stocké sur le serveur.
          # Le jeton passe par stdin : dans la commande, il serait lisible par
          # tout utilisateur du VPS via « ps ».
          # Les identifiants du rôle « app » (mot de passe, superutilisateur) sont
          # lus depuis le .env déjà déposé sur le VPS (« \$… » : résolus côté VPS,
          # jamais sur le runner). L'ordre est contraint : « migrate » crée le schéma
          # « data » avant le provisionnement (qui pose les GRANT dessus), et l'app
          # n'est démarrée puis migrée qu'une fois son rôle prêt.
          printf '%s' "$JETON_GHCR" | ssh -i ~/.ssh/deploiement "$UTILISATEUR@$HOTE" \
            "docker login ghcr.io -u '$COMPTE_GHCR' --password-stdin \
             && cd '$REPERTOIRE_VPS' \
             && docker compose pull \
             && docker compose up -d db \
             && docker compose run --rm -T migrate \
             && set -a && . ./.env && set +a \
             && docker compose exec -T db psql -v ON_ERROR_STOP=1 -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -v mot_de_passe=\"\$APP_DB_PASSWORD\" -v superutilisateur=\"\$POSTGRES_USER\" < provisionner-app.sql \
             && docker compose up -d app caddy cron \
             && docker compose exec -T app php bin/console doctrine:migrations:migrate --no-interaction \
             && docker compose exec -T app php bin/console cache:clear --env=prod \
             && docker logout ghcr.io"

      - name: Effacer les traces locales
        if: always()
        run: rm -f deploiement.env ~/.ssh/deploiement
