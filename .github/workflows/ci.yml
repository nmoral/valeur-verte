name: CI

# Un seul workflow, un seul check requis : `gate`.
# Les vérifications lourdes ne tournent que si le périmètre concerné change
# (data/** ou app/**) ; `gate` reste vert quand elles sont non concernées
# (docs, infra…) et rouge dès qu'une vérification réelle échoue. Cela permet
# l'auto-merge des PR sans code sans contourner les portes qualité.
#
# Déclenché **uniquement sur pull request** : `main` n'accepte que des merges de
# PR déjà vertes, rejouer le CI sur le push de merge ne ferait que doubler le coût.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

# Un nouveau push sur une PR annule le run précédent encore en cours : retour
# plus rapide et pas de minutes gaspillées sur un état déjà dépassé.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      data: ${{ steps.filter.outputs.data }}
      app: ${{ steps.filter.outputs.app }}
      infra: ${{ steps.filter.outputs.infra }}
      # Liste des sources data/ modifiées vs base, pour scoper le mutation testing (#151).
      data_src_files: ${{ steps.filter.outputs.data_src_files }}
      # Idem côté app/ : Infection ne mute que les fichiers src/ changés (pas tout src/).
      app_src_files: ${{ steps.filter.outputs.app_src_files }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          list-files: shell
          filters: |
            data:
              - 'data/**'
              - '.github/workflows/ci.yml'
            data_src:
              - 'data/src/**/*.py'
            app:
              - 'app/**'
            app_src:
              - 'app/src/**/*.php'
            # Ce qui compose réellement l'image déployée, plus le déploiement
            # lui-même : les tests de data/ n'entrent pas dans l'image.
            infra:
              - 'infra/**'
              - 'data/Dockerfile'
              - 'data/.dockerignore'
              - 'data/pyproject.toml'
              - 'data/src/**'
              - 'app/Dockerfile'
              - 'app/.dockerignore'
              - '.github/workflows/deploy.yml'
              - '.github/workflows/ci.yml'

  data-quality:
    needs: changes
    if: needs.changes.outputs.data == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: data/pyproject.toml
      - name: Installer les dépendances
        run: pip install -e '.[dev]'
      - name: Lint & format (Ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Analyse statique (mypy)
        run: mypy src
      - name: Tests (pytest)
        run: pytest
      # Scopé aux sources data/ modifiées vs base (#151) : mutation testing sur la
      # « maille de code touchée » (CLAUDE.md §3), pas sur tout src/. Si aucune source
      # n'a changé (PR docs/tests/CI seule), SCOPE_REQUIRED=1 fait ignorer l'étape.
      - name: Mutation testing (mutmut, MSI >= 80 %, scopé aux fichiers changés)
        env:
          SCOPE_REQUIRED: "1"
        run: ./tools/run-mutation.sh 80 ${{ needs.changes.outputs.data_src_files }}

  # Migrations + écriture en base jouées contre un vrai PostGIS (container).
  data-integration:
    needs: changes
    if: needs.changes.outputs.data == 'true'
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: valeur_verte
          POSTGRES_PASSWORD: valeur_verte
          POSTGRES_DB: valeur_verte
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U valeur_verte -d valeur_verte"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://valeur_verte:valeur_verte@localhost:5432/valeur_verte
      # Base de service, détruite avec le job : les tests peuvent la vider.
      # Ce marqueur ne doit exister nulle part ailleurs (#112).
      VALEUR_VERTE_BASE_JETABLE: "1"
    defaults:
      run:
        working-directory: data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: data/pyproject.toml
      - name: Installer les dépendances
        run: pip install -e '.[dev]'
      - name: Migrations + tests d'intégration (PostGIS réel)
        run: pytest -m integration

  # Invariants du déploiement : compose de production, workflow de déploiement,
  # et surtout l'artefact réel — l'image est construite puis exercée contre PostGIS.
  infra-quality:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: valeur_verte
          POSTGRES_PASSWORD: valeur_verte
          POSTGRES_DB: valeur_verte
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U valeur_verte -d valeur_verte"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://valeur_verte:valeur_verte@localhost:5432/valeur_verte
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: infra/pyproject.toml
      - name: Installer les dépendances
        run: pip install -e '.[dev]'
      - name: Lint & format (Ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Analyse statique (mypy)
        run: mypy tests
      - name: Tests (pytest, image incluse)
        run: pytest

  app-quality:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    # Les tests d'intégration s'exécutent contre un vrai PostGIS, sur une base de
    # test dédiée (valeur_verte_test), jamais celle de développement.
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: valeur_verte
          POSTGRES_PASSWORD: valeur_verte
          POSTGRES_DB: valeur_verte
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U valeur_verte -d valeur_verte"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Rôle applicatif « app » : écrit le schéma app, lit seulement data.
      DATABASE_URL: "postgresql://app:app@127.0.0.1:5432/valeur_verte?serverVersion=16&charset=utf8"
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Configurer PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: pcov
          extensions: pdo_pgsql, intl, gd
          tools: composer
      # vendor/ restauré tel quel entre runs quand composer.lock ne bouge pas :
      # composer install ne fait alors que vérifier, il ne retélécharge rien.
      - name: Cache Composer (vendor)
        uses: actions/cache@v4
        with:
          path: app/vendor
          key: composer-${{ runner.os }}-php8.4-${{ hashFiles('app/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.4-
      - name: Installer les dépendances
        run: composer install --no-interaction --no-progress
      - name: Préparer les bases (rôle app, schéma app, base de test)
        working-directory: .
        env:
          PGHOST: localhost
          PGPASSWORD: valeur_verte
          POSTGRES_USER: valeur_verte
          POSTGRES_DB: valeur_verte
        run: bash infra/db-init/10-init-app.sh
      - name: Migrations (base de test)
        run: php bin/console doctrine:migrations:migrate --env=test --no-interaction
      - name: Lint & format (PHP-CS-Fixer)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - name: Analyse statique (PHPStan)
        run: vendor/bin/phpstan analyse
      - name: Tests (PHPUnit)
        run: vendor/bin/phpunit
      # Infection échoue s'il n'a aucune source à muter : au stade de l'amorçage,
      # src/ ne contient que la glue Symfony (Kernel.php, exclu). On ne lance donc
      # la mutation que lorsqu'il existe du code métier.
      - name: Mutation testing (Infection, MSI >= 80 %, scopé aux fichiers changés)
        env:
          # Fichiers app/src/*.php modifiés vs base (paths-filter, list-files: shell).
          APP_SRC_FILES: ${{ needs.changes.outputs.app_src_files }}
        run: |
          # Chemins rendus relatifs à app/ (Infection tourne ici) et joints par des
          # virgules pour --filter. On ne mute que ces fichiers, pas tout src/
          # (CLAUDE.md §3 « MSI par maille de code touchée ») : d'une PR de quelques
          # fichiers, la mutation passe de plusieurs minutes à quelques secondes.
          CHANGED=$(printf '%s\n' $APP_SRC_FILES | sed 's#^app/##' | grep -E '\.php$' | paste -sd, - || true)
          if [ -n "$CHANGED" ]; then
            # Couverture générée par un run PHPUnit dédié, puis Infection SANS sa
            # passe initiale : cette passe (phpunit sous pcov + le flot de logs du
            # kernel en test) se fait tuer par SIGTERM (exit 143) dans ce contexte.
            # Le seuil MSI reste intégralement appliqué.
            vendor/bin/phpunit --coverage-xml=var/cov/coverage-xml --log-junit=var/cov/junit.xml
            vendor/bin/infection --coverage=var/cov --skip-initial-tests --threads=max \
              --filter="$CHANGED" --min-covered-msi=80
          else
            echo "Aucun fichier src/ modifié — mutation ignorée."
          fi

  # Seul check requis en protection de branche. Vert si les vérifications
  # concernées passent OU ne sont pas concernées (skippées) ; rouge sinon.
  gate:
    needs: [changes, data-quality, data-integration, app-quality, infra-quality]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier qu'aucune vérification requise n'a échoué
        run: |
          echo "changes          = ${{ needs.changes.result }}"
          echo "data-quality     = ${{ needs.data-quality.result }}"
          echo "data-integration = ${{ needs.data-integration.result }}"
          echo "app-quality      = ${{ needs.app-quality.result }}"
          echo "infra-quality    = ${{ needs.infra-quality.result }}"
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::La détection de changements a échoué — gate bloquant par sécurité."
            exit 1
          fi
          for result in \
            "${{ needs.data-quality.result }}" \
            "${{ needs.data-integration.result }}" \
            "${{ needs.app-quality.result }}" \
            "${{ needs.infra-quality.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::Une vérification requise a échoué ($result)."
              exit 1
            fi
          done
          echo "OK — vérifications réussies ou non concernées."
