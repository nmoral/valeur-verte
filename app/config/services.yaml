# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Domaine de base du monolithe : chaque zone vit sur son sous-domaine
    # (app., admin., widget.). Surchargé par l'environnement en production.
    app.domaine: '%env(APP_DOMAINE)%'
    # Nombre maximal d'URLs par fichier sitemap (#365) : la spec sitemaps.org
    # borne à 50 000 URLs / 50 Mo. Au-delà, le sitemap index paginé prend le relais.
    app.sitemap.max_urls: 50000

    # Périmètre de publication SEO (#393) : mise en ligne progressive. Au go-live,
    # seuls la carte et les hubs des départements listés sont accessibles/indexés ;
    # les pages commune et EPCI ne le sont que si leur type est activé. Défaut =
    # Occitanie (13 départements), hubs seuls — élargi par phases via l'environnement
    # (VV_PERIMETRE_DEPARTEMENTS, VV_COMMUNES_PUBLIQUES, VV_EPCI_PUBLICS), sans code.
    app.perimetre.departements_defaut: '09,11,12,30,31,32,34,46,48,65,66,81,82'
    app.perimetre.departements: '%env(csv:default:app.perimetre.departements_defaut:VV_PERIMETRE_DEPARTEMENTS)%'
    app.perimetre.communes_publiques_defaut: false
    app.perimetre.communes_publiques: '%env(bool:default:app.perimetre.communes_publiques_defaut:VV_COMMUNES_PUBLIQUES)%'
    app.perimetre.epci_publics_defaut: false
    app.perimetre.epci_publics: '%env(bool:default:app.perimetre.epci_publics_defaut:VV_EPCI_PUBLICS)%'

    # Sauvegarde de la base (#55). Défauts du poste de dev ; le cron du VPS fixe
    # VV_SAUVEGARDE_DIR (volume monté) et, au besoin, VV_SAUVEGARDE_RETENTION_JOURS.
    app.sauvegarde.repertoire_defaut: '%kernel.project_dir%/var/sauvegardes'
    app.sauvegarde.retention_defaut: 30
    app.sauvegarde.hote_defaut: 'db'
    app.sauvegarde.port_defaut: 5432
    app.sauvegarde.user_defaut: 'app'
    app.sauvegarde.pass_defaut: 'app'
    app.sauvegarde.base_defaut: 'valeur_verte'

    # Effacement de compte (#308, RGPD) : délai de grâce entre la demande de
    # suppression et l'effacement définitif. Partagé par le finaliseur (cron) et
    # l'écran de self-service, pour que la date annoncée au pro soit celle appliquée.
    app.suppression_compte.delai_grace_jours: 30

    # Anti-abus de recréation (#332) : durée de rétention de l'empreinte d'un compte
    # effacé. Au-delà, priver un compte recréé de son essai n'est plus proportionné
    # (RGPD) — le cron de purge (registre #190) l'efface.
    app.trace_effacement.retention_mois: 12

    # Mentions légales (#228, LCEN art. 6-III) : l'identité de l'éditeur et celle
    # de l'hébergeur vivent ici plutôt que dans le gabarit — un changement de
    # siège ou de statut ne doit pas passer par une modification de HTML.
    # Éditeur = entreprise individuelle (l'éditeur est la personne physique) ;
    # identité vérifiée via recherche-entreprises.api.gouv.fr (SIRET), nom et
    # adresse fournis par l'éditeur car non-diffusibles en open data SIRENE.
    app.editeur:
        raison_sociale: 'Nicolas Moral'
        forme_juridique: 'Entrepreneur individuel'
        immatriculation: 'SIRET 925 313 207 00019'
        siege: '4 rue de Nancy, 31500 Toulouse, France'
        directeur_publication: 'Nicolas Moral'
        contact: '%env(CONTACT_REPONSE)%'
    app.hebergeur:
        identite: 'OVH SAS'
        adresse: '2 rue Kellermann, 59100 Roubaix, France'
        telephone: '+33 9 72 10 10 07'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # Périmètre de publication SEO (#393) : allowlist de départements + flags de types
    # (non autowirable — tableau + booléens ; alimenté par les paramètres app.perimetre.*).
    App\Publication\PerimetrePublic:
        arguments:
            $departements: '%app.perimetre.departements%'
            $communesPubliques: '%app.perimetre.communes_publiques%'
            $epciPublics: '%app.perimetre.epci_publics%'

    # Mentions légales (#228) : identité de l'éditeur et de l'hébergeur.
    App\Controller\PagesLegalesController:
        arguments:
            $editeur: '%app.editeur%'
            $hebergeur: '%app.hebergeur%'
        tags: ['controller.service_arguments']

    # Traçabilité de la levée du cloisonnement (#54) : inscrite au journal d'audit (#50).
    App\Tenant\TraceDesactivationTenant: '@App\AdminInterne\JournalAudit\TraceDesactivationViaJournal'

    # Journal d'audit de l'admin interne (#50) : registre append-only persisté.
    App\AdminInterne\JournalAudit\JournalAudit: '@App\AdminInterne\JournalAudit\JournalAuditDoctrine'

    # Notification admin d'un usage anormal (#44) : inscrite au journal d'audit (#50).
    App\Notification\NotificationAdmin: '@App\AdminInterne\JournalAudit\NotificationAdminViaJournal'

    # Périmètre d'URLs de l'audit SEO (#345) : sitemap + pages widget marque blanche.
    App\AdminInterne\SeoAudit\SourceUrls: '@App\AdminInterne\SeoAudit\CollecteurUrls'

    # Présence SEO externe (#346) : clients Google. Secrets hors dépôt via %env% ;
    # vides = clients inertes (patron Turnstile). Ports → implémentations.
    # Auth Search Console par OAuth utilisateur (refresh token) : les clés de compte de
    # service sont bloquées par une règle d'organisation Google.
    App\AdminInterne\SeoPresence\Google\JetonOAuthUtilisateurGoogle:
        arguments:
            $clientId: '%env(GSC_OAUTH_CLIENT_ID)%'
            $clientSecret: '%env(GSC_OAUTH_CLIENT_SECRET)%'
            $refreshToken: '%env(GSC_OAUTH_REFRESH_TOKEN)%'
    # Amorçage « une fois » du refresh token (commande app:seo:presence:autoriser).
    App\AdminInterne\SeoPresence\Google\AutorisationOAuthGoogle:
        arguments:
            $clientId: '%env(GSC_OAUTH_CLIENT_ID)%'
            $clientSecret: '%env(GSC_OAUTH_CLIENT_SECRET)%'
    App\AdminInterne\SeoPresence\Google\SearchConsoleViaGoogleApi:
        arguments:
            $siteUrl: '%env(GSC_SITE_URL)%'
    App\AdminInterne\SeoPresence\Google\PageSpeedViaGoogleApi:
        arguments:
            $cleApi: '%env(PAGESPEED_API_KEY)%'
    App\AdminInterne\SeoPresence\Google\JetonAcces: '@App\AdminInterne\SeoPresence\Google\JetonOAuthUtilisateurGoogle'
    App\AdminInterne\SeoPresence\SearchConsole: '@App\AdminInterne\SeoPresence\Google\SearchConsoleViaGoogleApi'
    App\AdminInterne\SeoPresence\PageSpeed: '@App\AdminInterne\SeoPresence\Google\PageSpeedViaGoogleApi'

    # Sauvegarde de la base (#55, §9.11). Répertoire et rétention réglables par
    # l'environnement (le cron du VPS monte un volume et fixe VV_SAUVEGARDE_DIR) ;
    # défauts pour le poste de dev. Le dump réel est pg_dump via Symfony Process.
    App\Exploitation\Sauvegarde\Sauvegarde:
        arguments:
            $repertoire: '%env(default:app.sauvegarde.repertoire_defaut:VV_SAUVEGARDE_DIR)%'
            $retentionJours: '%env(int:default:app.sauvegarde.retention_defaut:VV_SAUVEGARDE_RETENTION_JOURS)%'
    App\Exploitation\Sauvegarde\ExecuteurDump: '@App\Exploitation\Sauvegarde\ExecuteurDumpPgDump'
    App\Exploitation\Sauvegarde\ExecuteurDumpPgDump:
        arguments:
            # Connexion **privilégiée** : pg_dump de la base entière (schémas app +
            # data + PostGIS) exige un rôle qui possède tout — le rôle « app » (moindre
            # privilège, lecture seule sur data) ne peut dumper ni data.* ni
            # public.schema_migrations. En production, le cron fixe VV_SAUVEGARDE_DB_*
            # sur le rôle superutilisateur ; à défaut, la base locale de dev.
            $hote: '%env(default:app.sauvegarde.hote_defaut:VV_SAUVEGARDE_DB_HOST)%'
            $port: '%env(int:default:app.sauvegarde.port_defaut:VV_SAUVEGARDE_DB_PORT)%'
            $utilisateur: '%env(default:app.sauvegarde.user_defaut:VV_SAUVEGARDE_DB_USER)%'
            $motDePasse: '%env(default:app.sauvegarde.pass_defaut:VV_SAUVEGARDE_DB_PASSWORD)%'
            $base: '%env(default:app.sauvegarde.base_defaut:VV_SAUVEGARDE_DB_NAME)%'
    App\Exploitation\Sauvegarde\LanceurProcessus: '@App\Exploitation\Sauvegarde\LanceurProcessusSymfony'

    # Santé applicative (#313) : les sondes de l'endpoint /sante. Écriture dans
    # var/ (cache, journaux, PDF) et état des migrations — cette dernière n'est pas
    # autowirable, le bundle ne publie sa fabrique que sous son identifiant.
    App\Exploitation\Sante\SondeEcriture:
        arguments:
            $repertoire: '%kernel.project_dir%/var'
    App\Exploitation\Sante\SondeMigrations:
        arguments:
            $fabrique: '@doctrine.migrations.dependency_factory'

    # Cache-busting des assets : versionne par hash du fichier servi.
    App\Asset\VersionParContenu:
        arguments:
            $repertoirePublic: '%kernel.project_dir%/public'

    # Bascule maintenance (#197) : APP_MAINTENANCE=1 coupe les zones publique/pro
    # en 503 (page habillée), l'admin restant accessible pour l'exploitation.
    App\Erreur\Maintenance\ModeMaintenanceListener:
        arguments:
            $maintenanceActive: '%env(bool:APP_MAINTENANCE)%'

    # Vitrine restreinte (#385) : APP_VITRINE_RESTREINTE=1 ferme la zone pro (app.)
    # en la redirigeant vers l'accueil public. Active par défaut le temps de
    # l'observation d'usage ; éteinte, l'espace pro rouvre sans redéploiement.
    App\Vitrine\VerrouillageEspaceProListener:
        arguments:
            $vitrineRestreinte: '%env(bool:APP_VITRINE_RESTREINTE)%'

    # Le limiteur d'inscription reçoit la fabrique nommée « inscription_ip ».
    App\Security\LimiteurInscription:
        arguments:
            $inscriptionIpLimiter: '@limiter.inscription_ip'

    # Anti-abus du simulateur public (#385) : les deux fabriques nommées (émission
    # du rapport par IP, autocomplétion d'adresse par IP).
    App\Simulateur\PlafondSimulateur:
        arguments:
            $simulateurIpLimiter: '@limiter.simulateur_ip'
            $simulateurAdresseIpLimiter: '@limiter.simulateur_adresse_ip'

    # Plafond anti-abus du widget (#43) : les deux fabriques nommées (par IP et par page).
    App\Widget\PlafondWidget:
        arguments:
            $widgetIpLimiter: '@limiter.widget_ip'
            $widgetPageLimiter: '@limiter.widget_page'
            $widgetEmissionLimiter: '@limiter.widget_emission'
            $widgetEvenementLimiter: '@limiter.widget_evenement'
            $widgetAdresseLimiter: '@limiter.widget_adresse'

    # Jeton de chargement du widget (#43) : signé au secret applicatif (timing + anti-rejeu).
    App\Widget\JetonChargementWidget:
        arguments:
            $secret: '%kernel.secret%'

    # Seuils de l'anti-abus réactif du widget (#268) : calibration par défaut,
    # objet-valeur (pas de service autowirable sans fabrique).
    App\Widget\SeuilsAntiAbusWidget:
        factory: ['App\Widget\SeuilsAntiAbusWidget', 'parDefaut']

    # Page publique du pro (#38) : le lien partagé est bâti sur le sous-domaine widget.
    App\Widget\PagePubliqueDuPro:
        arguments:
            $appDomaine: '%app.domaine%'

    # Jeton d'une page publique (#38) : tirage aléatoire, 16 octets hexadécimaux.
    App\Widget\TirageJeton: '@App\Widget\TirageJetonAleatoire'

    # Autocomplétion d'adresse de la page publique (#287) : résolution du code
    # INSEE côté serveur, pour que le navigateur ne parle qu'à notre origine.
    App\Widget\RechercheAdresse: '@App\Widget\RechercheAdresseViaBan'

    # Vérification Turnstile (#43) : secret Cloudflare depuis l'environnement (vide = inerte).
    App\Widget\VerificateurTurnstile:
        arguments:
            $secret: '%env(TURNSTILE_SECRET)%'

    # Lecture des coefficients et du prix de marché dans le schéma « data »
    # (lecture seule pour « app ») : chaîne de calcul économique (#25).
    App\BackOffice\Estimation\FournisseurCoefficientMaille: '@App\BackOffice\Estimation\CoefficientMailleDbal'
    App\BackOffice\Estimation\FournisseurPrixMaille: '@App\BackOffice\Estimation\PrixMailleDbal'

    # Bloc « Pourquoi ici ? » (#341) : lecture des marqueurs (data.marqueurs, lecture
    # seule) et moteur de narration monté sur la liste blanche (non autowirable, il
    # prend un tableau de règles → fabrique parDefaut()).
    App\PourquoiIci\FournisseurMarqueurs: '@App\PourquoiIci\MarqueursDbal'
    App\PourquoiIci\MoteurPourquoiIci:
        factory: ['App\PourquoiIci\MoteurPourquoiIci', 'parDefaut']

    # Génération du PDF (#32) : moteur de conversion mpdf et fabrique
    # d'identifiants de rapport aléatoires (§9.6).
    App\BackOffice\Pdf\ConvertisseurPdf: '@App\BackOffice\Pdf\MpdfConvertisseur'
    App\BackOffice\Pdf\GenerateurReferenceRapport: '@App\BackOffice\Pdf\ReferenceRapportAleatoire'

    # Relance de fin d'essai (#108) : le lien de l'espace pro dans l'email de
    # relance est construit sur le domaine applicatif (sous-domaine app.).
    App\Compte\RelanceEssais:
        arguments:
            $appDomaine: '%app.domaine%'

    # Relance conversationnelle après le premier rapport (#109) : lien de
    # désabonnement sur le domaine applicatif, réponses vers une vraie boîte.
    App\Compte\NotificationPremierRapport:
        arguments:
            $appDomaine: '%app.domaine%'
            $contactReponse: '%env(CONTACT_REPONSE)%'

    # Jeton de désabonnement (#108/#109) : signe le tenant avec le secret
    # applicatif pour rendre le lien de désabonnement infalsifiable sans stockage.
    App\Compte\JetonDesabonnement:
        arguments:
            $secret: '%kernel.secret%'

    # Jeton de vérification d'email (#105, ONB-1) : signe l'utilisateur avec le
    # secret applicatif pour un lien de confirmation infalsifiable, sans stockage.
    App\Security\VerificationEmail\JetonVerificationEmail:
        arguments:
            $secret: '%kernel.secret%'

    # Empreinte d'effacement (#332) : signe l'adresse canonique avec le secret
    # applicatif pour reconnaître une réinscription sans conserver l'adresse en clair.
    App\Compte\EmpreinteEffacement:
        arguments:
            $secret: '%kernel.secret%'

    # Purge des traces d'effacement (#332) : rétention bornée, jouée par le cron.
    App\Compte\PurgeTracesEffacement:
        arguments:
            $retentionMois: '%app.trace_effacement.retention_mois%'

    # Envoi de l'email de vérification (#105) : lien construit sur le sous-domaine app.
    App\Security\VerificationEmail\EnvoiVerificationEmail:
        arguments:
            $appDomaine: '%app.domaine%'

    # Mot de passe oublié (#194, AUTH-1) : le lien de réinitialisation est construit
    # sur le sous-domaine app. et le jeton expire après cette durée (usage unique).
    App\Security\MotDePasseOublie\DemandeReinitialisation:
        arguments:
            $appDomaine: '%app.domaine%'
            $dureeValiditeMinutes: 60

    # Enrôlement du second facteur (#312) : lien émis en ligne de commande sur le
    # VPS et utilisé dans la foulée. Trente minutes — un lien qui traîne une heure
    # dans un historique de terminal est une porte ouverte sur l'admin.
    App\Security\DeuxFacteurs\EnrolementSecondFacteur:
        arguments:
            $dureeValiditeMinutes: 30

    App\Security\DeuxFacteurs\Command\EnrolerSecondFacteurCommand:
        arguments:
            $appDomaine: '%app.domaine%'
            $dureeValiditeMinutes: 30

    # Changement d'adresse email (#310) : lien de confirmation sur le sous-domaine
    # app., à durée de vie courte. Plus courte que la réinitialisation de mot de
    # passe (60 min) n'aurait pas de sens — c'est le même geste, relever une boîte ;
    # plus longue laisserait vivre une bascule qu'on a pu vouloir annuler.
    App\Security\ChangementEmail\EnvoiDemandeChangementEmail:
        arguments:
            $appDomaine: '%app.domaine%'
            $dureeValiditeMinutes: 60

    # Rétention des événements de parcours (#90) : durée de conservation courte,
    # cohérente avec la finalité déclarée (mesure d'audience et de conversion).
    # La purge est jouée par un cron quotidien (registre #190).
    App\Widget\PurgeEvenementsWidget:
        arguments:
            $retentionJours: 90

    # Rétention des événements du parcours d'inscription (#111) : même finalité de
    # mesure (activation self-service), même durée courte, même cron (registre #190).
    App\Onboarding\Parcours\PurgeEvenementsInscription:
        arguments:
            $retentionJours: 90

    # Rétention des rapports (décision D10, #68) : à 24 mois du dernier contact
    # connu — faute de suivi d'interaction, la production du rapport — le contact
    # est effacé et l'adresse bornée à la commune ; à 3 ans, le rapport est
    # supprimé. Les deux durées sont celles publiées dans la politique de
    # confidentialité. Purge jouée par un cron quotidien (#190).
    App\BackOffice\Rapport\RetentionRapports:
        arguments:
            $anonymisationMois: 24
            $suppressionMois: 36

    # Effacement de compte (#308, RGPD droit à l'effacement) : à la demande — en
    # self-service par le pro ou honorée par l'admin — le compte est marqué, puis
    # effacé définitivement après un délai de grâce, une suppression accidentelle
    # ne se rattrapant pas. Choix produit #308 : rapports et leads partent avec le
    # compte. Finaliseur joué par un cron quotidien (#190).
    App\AdminInterne\Compte\EffacementCompte:
        arguments:
            $delaiDeGraceJours: '%app.suppression_compte.delai_grace_jours%'

    # Écran de résiliation self-service (#308) : le même délai de grâce, pour que
    # la date d'effacement montrée au pro soit exactement celle que le cron applique.
    App\Controller\Compte\SuppressionCompteController:
        arguments:
            $delaiDeGraceJours: '%app.suppression_compte.delai_grace_jours%'
        tags: ['controller.service_arguments']

    # Rétention des demandes de lead (#292) : une demande jamais confirmée porte
    # des données nominatives sans consentement confirmé — elle est supprimée peu
    # après son expiration (grâce, pour un clic tardif). Une demande confirmée est
    # déjà un Rapport (#37) : sa ligne d'origine ne se garde qu'un mois, le temps
    # d'un support ou d'une réclamation. Purge jouée par un cron quotidien (#190).
    App\Widget\PurgeDemandesLeadWidget:
        arguments:
            $graceJours: 7
            $gardeJours: 30

    # Capture de lead widget (#42) : lien de confirmation d'opt-in construit sur le
    # sous-domaine widget. ; le jeton expire après cette durée (usage unique).
    App\Widget\CaptureLead:
        arguments:
            $appDomaine: '%app.domaine%'
            $dureeValiditeMinutes: 1440

    # Envoi d'email transactionnel (#108) : adaptateur Brevo (API HTTP). Clé et
    # adresse expéditrice depuis l'environnement, jamais versionnées.
    App\Notification\Mailer: '@App\Notification\MailerBrevo'
    App\Notification\MailerBrevo:
        arguments:
            $apiKey: '%env(BREVO_API_KEY)%'
            $expediteur: '%env(BREVO_EXPEDITEUR)%'

    # Page publique de publication (#48, #224) : lecture du millésime publié dans
    # le schéma « data » (lecture seule) et contours départementaux figés.
    App\Publication\LectureModelePublie: '@App\Publication\LectureModelePublieDbal'
    App\Publication\ContoursDepartements:
        arguments:
            $fichier: '%kernel.project_dir%/resources/publication/contours-departements.json'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@dev:
    services:
        # En dev, on n'appelle pas Brevo : l'email est journalisé (lien inclus)
        # pour inspecter les parcours (opt-in, confirmation) au navigateur.
        App\Notification\Mailer: '@App\Notification\MailerJournal'

when@test:
    services:
        # Périmètre de publication (#393) : ouvert en test (toutes les pages
        # accessibles), pour que les tests fonctionnels existants (communes/EPCI,
        # départements hors Occitanie) restent verts. Les tests du gating restrictif
        # substituent leur propre PerimetrePublic via le conteneur de test — d'où
        # « public: true ». Le bloc when@test n'hérite pas des _defaults.
        App\Publication\PerimetrePublic:
            public: true
            arguments:
                $departements: ['*']
                $communesPubliques: true
                $epciPublics: true

        # Exposé pour les tests tant qu'aucun service applicatif n'injecte le
        # hasher (l'inscription #105 le fera) : sans consommateur, l'alias
        # d'autowiring est élagué du conteneur et introuvable côté test.
        Symfony\Component\PasswordHasher\Hasher\UserPasswordHasherInterface:
            alias: security.user_password_hasher
            public: true

        # Second facteur (#312) : exposé pour les tests tant que la commande
        # d'enrôlement ne l'injecte pas — sans consommateur, le service est élagué
        # du conteneur compilé et introuvable côté test.
        # Le bloc when@test n'hérite pas des _defaults : sans autowire explicite,
        # la redéclaration écraserait la définition autowirée et le service
        # arriverait sans ses arguments.
        App\Security\DeuxFacteurs\CodesDeSecours:
            autowire: true
            public: true
        App\Security\DeuxFacteurs\EnrolementSecondFacteur:
            autowire: true
            public: true
            arguments:
                $dureeValiditeMinutes: 30

        # Recherche SIRET (#106) : doubles en mémoire, aucun appel réseau réel.
        App\Tests\BackOffice\Entreprise\Double\RechercheEntrepriseEnMemoire: ~
        App\Tests\BackOffice\Entreprise\Double\QualificationsRgeEnMemoire: ~
        App\BackOffice\Entreprise\RechercheEntreprise: '@App\Tests\BackOffice\Entreprise\Double\RechercheEntrepriseEnMemoire'
        App\BackOffice\Entreprise\QualificationsRge: '@App\Tests\BackOffice\Entreprise\Double\QualificationsRgeEnMemoire'

        # Estimation (#25/#31) : doubles en mémoire configurables par test, aucune
        # lecture du schéma « data ». Publics pour être configurés depuis les tests.
        App\Tests\BackOffice\Estimation\Double\FournisseurCoefficientMailleEnMemoire:
            public: true
        App\Tests\BackOffice\Estimation\Double\FournisseurPrixMailleEnMemoire:
            public: true
        App\BackOffice\Estimation\FournisseurCoefficientMaille: '@App\Tests\BackOffice\Estimation\Double\FournisseurCoefficientMailleEnMemoire'
        App\BackOffice\Estimation\FournisseurPrixMaille: '@App\Tests\BackOffice\Estimation\Double\FournisseurPrixMailleEnMemoire'

        # Autocomplétion d'adresse (#287) : double en mémoire, aucun appel BAN
        # réel sous test. Public pour être configuré et interrogé par le test.
        App\Tests\Widget\Double\RechercheAdresseEnMemoire:
            public: true
        App\Widget\RechercheAdresse: '@App\Tests\Widget\Double\RechercheAdresseEnMemoire'

        # Envoi d'email (#108) : double en mémoire, aucun envoi réel sous test.
        App\Tests\Notification\Double\MailerEnMemoire:
            public: true
