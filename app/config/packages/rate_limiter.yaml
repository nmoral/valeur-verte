# Anti-abus du widget public (#43, épic #6). Deux plafonds complémentaires sur les
# endpoints publics coûteux (estimation = calcul, capture de lead = emails) :
#  - widget_ip   : borne l'usage individuel d'une IP ;
#  - widget_page : borne le trafic d'une page/tenant, pour qu'une page seule ne
#                  puisse pas saturer le service (pic distribué sur IP multiples).
# Au dépassement de l'un ou l'autre : 429. Détection réactive et notification admin
# relèvent d'une issue dédiée (#268) — ici, seul le plafond préventif.
framework:
    rate_limiter:
        widget_ip:
            policy: 'sliding_window'
            limit: 20
            interval: '15 minutes'
        widget_page:
            policy: 'sliding_window'
            limit: 300
            interval: '1 hour'
        # Émission des jetons de chargement (GET du formulaire) plafonnée par IP :
        # borne le moissonnage de jetons frais destinés à alimenter des soumissions.
        widget_emission:
            policy: 'sliding_window'
            limit: 60
            interval: '5 minutes'
        # Collecte des événements de parcours (#90) : endpoint bavard mais très bon
        # marché (une écriture), d'où un plafond plus large que les endpoints
        # coûteux — il borne le bourrage de faux événements, pas l'usage normal
        # (une visite en déclare deux ou trois).
        widget_evenement:
            policy: 'sliding_window'
            limit: 120
            interval: '15 minutes'
        # Autocomplétion d'adresse (#287) : l'endpoint suit la frappe (anti-rebond
        # côté navigateur, ~une requête par mot saisi) mais sort du réseau à chaque
        # appel — plafond plus serré que la collecte d'événements, assez large pour
        # plusieurs saisies d'adresse d'affilée.
        widget_adresse:
            policy: 'sliding_window'
            limit: 60
            interval: '15 minutes'
        # Défi du second facteur de l'admin (#312), plafonné PAR COMPTE : six
        # chiffres avec 90 secondes de tolérance, ça s'énumère si rien ne le borne.
        # Cinq essais par quart d'heure — le même réglage que le plafond de
        # connexion (#307), pour la même raison : impraticable pour une
        # énumération, indolore pour une faute de frappe. La clé est le compte et
        # non l'IP : borner l'IP permettrait de verrouiller à distance l'admin
        # d'à côté.
        second_facteur_compte:
            policy: 'sliding_window'
            limit: 5
            interval: '15 minutes'
