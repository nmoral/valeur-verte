security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Les comptes vivent en base (schéma app), identifiés par l'email.
    providers:
        app_user_provider:
            entity:
                class: App\Security\User
                property: email

    # Trois zones, une seule authentification (§10.1) :
    #  - widget.  : public, stateless — la page hébergée est ouvertement accessible
    #               (D9, docs/PAGE-PUBLIQUE.md) : pas d'authentification, le jeton
    #               opaque de l'URL désigne le tenant, la sécurité tient aux plafonds,
    #               au Turnstile et à la CSP, pas à un firewall ;
    #  - app. / admin. : couverts par le firewall « main », login unique, la zone
    #               autorisée est décidée par le rôle (voir access_control).
    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        widget:
            host: '^widget\.'
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: login
                check_path: login
                username_parameter: email
                password_parameter: password
                enable_csrf: true
                success_handler: App\Security\RedirectionSelonRole
            logout:
                path: /logout
            # Force brute (#307) : plafond par couple (IP, identifiant), plus un
            # plafond global par IP à cinq fois ce nombre (Symfony). Plafonner la
            # seule IP laisserait passer une attaque distribuée ; plafonner le seul
            # identifiant permettrait de verrouiller à distance le compte de
            # n'importe qui. Une fenêtre de 15 minutes rend la force brute
            # impraticable sans punir la faute de frappe.
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

    # Seule la première règle qui matche s'applique : /login d'abord (publique
    # sur tout host), puis l'exigence de rôle par sous-domaine.
    access_control:
        # Santé applicative (#313) : la sonde du conteneur et la surveillance
        # externe n'ont pas de session. Ouverte, mais muette sur le détail
        # (un « ok »/« ko » par contrôle, rien d'exploitable).
        - { path: ^/sante$, roles: PUBLIC_ACCESS }
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/inscription$, roles: PUBLIC_ACCESS }
        # Mot de passe oublié (#194) : demande et réinitialisation publiques —
        # l'utilisateur n'est par définition pas connecté ; le jeton signé (lien
        # d'email) fait la sécurité de la réinitialisation.
        - { path: ^/mot-de-passe-oublie, roles: PUBLIC_ACCESS }
        # Confirmation d'email (#105) : lien signé cliqué sans session (public sur
        # tout host). Le renvoi (/verification-email/renvoyer) reste protégé par le
        # rôle du sous-domaine (règle plus stricte non matchée par ce chemin exact).
        - { path: ^/verification-email$, roles: PUBLIC_ACCESS }
        # Désabonnement par lien signé depuis l'email (#108/#109) : public sur
        # tout host, la signature du jeton fait la sécurité — avant l'exigence de rôle.
        - { path: ^/desabonnement, roles: PUBLIC_ACCESS }
        - { host: '^admin\.', roles: ROLE_ADMIN }
        - { host: '^app\.', roles: ROLE_PRO }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
