security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Les comptes vivent en base (schéma app), identifiés par l'email.
    providers:
        app_user_provider:
            entity:
                class: App\Security\User
                property: email

    # Trois zones, une seule authentification (§10.1) :
    #  - widget.  : public, stateless (l'authentificateur par token signé viendra
    #               avec le domaine widget) ;
    #  - app. / admin. : couverts par le firewall « main », login unique, la zone
    #               autorisée est décidée par le rôle (voir access_control).
    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        widget:
            host: '^widget\.'
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: login
                check_path: login
                username_parameter: email
                password_parameter: password
                enable_csrf: true
                success_handler: App\Security\RedirectionSelonRole
            logout:
                path: /logout

    # Seule la première règle qui matche s'applique : /login d'abord (publique
    # sur tout host), puis l'exigence de rôle par sous-domaine.
    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { host: '^admin\.', roles: ROLE_ADMIN }
        - { host: '^app\.', roles: ROLE_PRO }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
