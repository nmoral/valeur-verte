doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
        # Doctrine ne gère QUE le schéma « app ». Le rôle a search_path=app, donc
        # ses tables sont introspectées non qualifiées ; « data »/« public » (postgis)
        # apparaissent qualifiées (schema.table). On ne garde que les noms non
        # qualifiés : « data » reste invisible du diff et des migrations, et la table
        # de métadonnées (non qualifiée) est bien détectée.
        schema_filter: ~^[^.]+$~
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src'
                prefix: 'App'
                alias: App
        # Cloisonnement multi-tenant (D3, #54) : activé par requête par le
        # TenantRequestListener dès qu'un pro est connecté.
        filters:
            tenant:
                class: App\Tenant\TenantFilter
                enabled: false

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
