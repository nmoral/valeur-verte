# Provisioning PostGIS pour le pipeline `data` (§7, §10.6).
# Local :  docker compose -f infra/docker-compose.yml up -d db
# VPS   :  déployé par le workflow de déploiement (#78), secrets côté GitHub.
services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-valeur_verte}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-valeur_verte}
      POSTGRES_DB: ${POSTGRES_DB:-valeur_verte}
    # Idem pour la base — voir scripts/worktree-env.sh pour la dérivation.
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Rôle et schéma applicatifs (app en écriture, data en lecture seule) — #37.
      # Joué une seule fois, à la création du volume.
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-valeur_verte} -d ${POSTGRES_DB:-valeur_verte}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Application construite localement depuis app/Dockerfile — le même artefact
  # FrankenPHP que celui déployé sur le VPS, pour l'exercer en bout-en-bout.
  # Local :  docker compose -f infra/docker-compose.yml up -d --build app
  app:
    build:
      context: ../app
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: prod
      # Rôle applicatif « app » sur la base partagée : écrit le schéma app, lit
      # seulement data. L'hôte est le service « db » du réseau interne du compose.
      DATABASE_URL: "postgresql://app:app@db:5432/valeur_verte?serverVersion=16&charset=utf8"
    # Port d'hôte propre au worktree (scripts/worktree-env.sh) : deux stacks
    # lancées en parallèle depuis deux worktrees ne se disputent pas le 8000.
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:80"
    # Même sonde qu'en production (#313) : la stack locale exerce l'artefact du VPS,
    # sa santé doit vouloir dire la même chose. Sans elle, le conteneur héritait de
    # la sonde d'administration de FrankenPHP et s'affichait « unhealthy » en
    # permanence, sans rien dire de l'application. La sonde interroge le port 80 du
    # conteneur, pas le port d'hôte : elle est indifférente au décalage par worktree.
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:80/sante"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  db_data:
