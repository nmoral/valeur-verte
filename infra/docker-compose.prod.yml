# Déploiement du pipeline « data » sur le VPS OVH (#78).
#
# Déposé dans /opt/valeur-verte par le workflow .github/workflows/deploy.yml,
# qui écrit à côté un fichier `.env` (mode 600) contenant les variables ci-dessous.
# Aucune valeur de repli n'est fournie : une variable manquante doit faire échouer
# le déploiement, jamais démarrer la base avec un identifiant de développement.
#
# La base n'expose aucun port : seuls les services du réseau interne l'atteignent.
# Pour une session psql d'exploitation, passer par un tunnel SSH.

# Environnement applicatif, partagé par le service web et l'ordonnanceur des
# tâches planifiées (#300) : les deux tournent la même image et doivent voir
# exactement la même configuration. L'ancre YAML l'assure — une variable
# ajoutée pour l'un ne peut pas manquer à l'autre.
x-environnement-app: &environnement_app
  APP_ENV: prod
  # Bascule maintenance (#197) : passe-plat depuis le .env du VPS pour couper
  # en 503 (page habillée) sans redéployer. Volontairement sans « :? » : une
  # variable absente laisse le service ouvert (défaut off dans le .env écrit
  # par ecrire-env.sh), jamais fermé par accident. 1 = maintenance active.
  APP_MAINTENANCE: ${APP_MAINTENANCE}
  # Secret Symfony (jetons signés — vérification d'email #105, réinitialisation
  # #194 —, protection CSRF). Sans lui, l'app tourne sur un secret vide : à
  # exiger explicitement, jamais de repli.
  APP_SECRET: ${APP_SECRET:?APP_SECRET est requis}
  # L'app partage la base PostGIS : écriture sur le schéma « app », lecture
  # seule sur « data » (schema_filter Doctrine + rôle « app » provisionné au
  # déploiement). DSN en format URL assemblée ici à partir du mot de passe
  # atomique du rôle (URL-safe, garanti par ecrire-env.sh).
  DATABASE_URL: "postgresql://app:${APP_DB_PASSWORD:?APP_DB_PASSWORD est requis}@db:5432/valeur_verte?serverVersion=16&charset=utf8"
  # TLS terminé par le reverse proxy (Caddy) : l'app dialogue en HTTP et doit
  # honorer X-Forwarded-Proto pour générer des URLs https. N'étant publiée que
  # sur 127.0.0.1 (jamais exposée en direct), son seul émetteur possible est le
  # proxy : « REMOTE_ADDR » le désigne sans dépendre de l'IP du conteneur Caddy.
  TRUSTED_PROXIES: REMOTE_ADDR
  # Domaine de production : les zones de l'app vivent sur ses sous-domaines
  # (app./admin./widget.). Sans cette variable, les routes restent sur le
  # défaut de l'image (*.valeurverte.localhost) et tout *.valeur-verte.fr
  # tombe en 404 derrière le proxy. Doit vivre ici (versionné) et non
  # seulement sur le VPS, sinon chaque redéploiement fait retomber le site.
  APP_DOMAINE: valeur-verte.fr
  # URLs générées hors contexte HTTP (commandes CLI, envois asynchrones) : sans
  # ça, elles retombent sur http://localhost (défaut de l'image).
  DEFAULT_URI: https://app.valeur-verte.fr
  # Email transactionnel (Brevo, #105/#108) : clé (secret), adresse expéditrice
  # et adresse de réponse des emails non transactionnels (#109/#195).
  BREVO_API_KEY: ${BREVO_API_KEY:?BREVO_API_KEY est requis}
  BREVO_EXPEDITEUR: no-reply@valeur-verte.fr
  CONTACT_REPONSE: contact@valeur-verte.fr

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER est requis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB est requis}
    # Publié sur la boucle locale du VPS uniquement : la base reste injoignable
    # depuis Internet, et un tunnel SSH suffit à l'atteindre pour l'exploitation
    # (psql, client graphique). Retirer « 127.0.0.1: » l'exposerait au monde —
    # c'est ce que vérifie test_compose_production.py.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Tâche ponctuelle rejouée à chaque livraison : les migrations sont idempotentes.
  migrate:
    image: ghcr.io/nmoral/valeur-verte-data:${DATA_IMAGE_TAG:?DATA_IMAGE_TAG est requis}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # DSN assemblée ici, à partir de valeurs atomiques : le format conninfo a
      # son propre quoting, et l'imbriquer dans celui du .env n'a pas de forme
      # sûre. Les apostrophes encadrent le mot de passe, qui peut contenir des
      # espaces (le script refuse apostrophe et barre oblique inverse).
      DATABASE_URL: >-
        host=db port=5432
        dbname='${POSTGRES_DB:?POSTGRES_DB est requis}'
        user='${POSTGRES_USER:?POSTGRES_USER est requis}'
        password='${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis}'
    command: ["valeur_verte_data.db.migrate"]

  # Application (widget, mode audit, back-office, admin) : image FrankenPHP publiée
  # sur GHCR par la CI puis tirée ici — le VPS ne construit rien.
  app:
    image: ghcr.io/nmoral/valeur-verte-app:${APP_IMAGE_TAG:?APP_IMAGE_TAG est requis}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: *environnement_app
    # TLS terminé par le proxy de l'hôte : publié sur la boucle locale du VPS,
    # jamais directement sur Internet (même règle que la base).
    ports:
      - "127.0.0.1:8000:80"

  # Ordonnanceur des tâches planifiées (#190, #300) : rétention des rapports (D10),
  # purges du widget, relance de fin d'essai. Même image et même environnement que
  # l'app — ce sont ses commandes Symfony —, mais aucun port : il ne sert rien.
  # supercronic est déjà dans l'image (voir app/Dockerfile) ; il journalise chaque
  # exécution sur la sortie standard (« docker compose logs cron ») et n'en démarre
  # jamais une seconde tant que la précédente tourne.
  cron:
    image: ghcr.io/nmoral/valeur-verte-app:${APP_IMAGE_TAG:?APP_IMAGE_TAG est requis}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *environnement_app
      # Sauvegarde de la base (#55, §9.11), portée par le seul ordonnanceur. Le dump
      # va dans le volume monté ci-dessous ; il tourne sous le rôle **superutilisateur**
      # (POSTGRES_USER), car « app » ne peut pas dumper le schéma « data » ni
      # public.schema_migrations. Ce DSN privilégié reste confiné au service cron.
      VV_SAUVEGARDE_DIR: /sauvegardes
      VV_SAUVEGARDE_DATABASE_URL: "postgresql://${POSTGRES_USER:?POSTGRES_USER est requis}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis}@db:5432/${POSTGRES_DB:?POSTGRES_DB est requis}"
    volumes:
      # Crontab versionné (infra/cron/crontab), téléversé par le workflow de
      # déploiement. Sans lui, Compose créerait un répertoire vide à sa place et
      # l'ordonnanceur démarrerait sans aucune tâche, sans erreur.
      - ./cron/crontab:/etc/supercronic/crontab:ro
      # Dumps de sauvegarde (#55) : volume nommé, persistant, propre au VPS. Pas de
      # copie hors-site (choix assumé, faute d'hébergement second) : protège d'une
      # migration ratée ou d'un effacement, pas d'une perte de l'hôte.
      - db_backups:/sauvegardes
    command: ["supercronic", "/etc/supercronic/crontab"]
    # L'image porte le contrôle de santé de FrankenPHP (son endpoint d'administration
    # sur :2019). Ce service ne lance aucun serveur web : la sonde échouerait à chaque
    # passage et l'ordonnanceur s'afficherait « unhealthy » pour toujours (#302). Il
    # n'y a rien de sensé à sonder à la place — supercronic est PID 1, sa mort fait
    # sortir le conteneur, ce dont « restart: unless-stopped » se charge déjà.
    healthcheck:
      disable: true

  # Reverse proxy (point d'entrée public unique) : termine TLS (certificats
  # Let's Encrypt automatiques), redirige HTTP→HTTPS, gate le site par basic auth
  # et bloque l'indexation (X-Robots-Tag + robots.txt) — voir caddy/Caddyfile.
  # Le site n'est pas encore public : accès en preview protégé le temps du lancement.
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    # Seul service exposé à Internet, et uniquement sur 80/443 (cf.
    # test_compose_production.py). Le reste du compose reste sur le réseau interne.
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Configuration téléversée par le workflow de déploiement (infra/caddy).
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/robots.txt:/etc/caddy/robots.txt:ro
      # Page servie par le proxy quand l'app est injoignable (#197) : autonome,
      # sans dépendance à l'app (handle_errors dans le Caddyfile).
      - ./caddy/erreur-indisponible.html:/etc/caddy/erreur-indisponible.html:ro
      # Certificats et état ACME : persistés pour survivre à une recréation du
      # conteneur (sinon réémission à chaque déploiement → limites Let's Encrypt).
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  db_backups:
  caddy_data:
  caddy_config:
